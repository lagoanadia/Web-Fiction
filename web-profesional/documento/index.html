<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu presupuesto · Lagoa</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/documento.css">
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #e9ebf1; color: #0b0d12; font-family: "Inter Tight", system-ui, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; padding: .8rem 16px; background: rgba(233, 235, 241, .92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid #d5d9e3; }
  .bar a.home { font-weight: 700; letter-spacing: .14em; color: inherit; text-decoration: none; margin-right: auto; font-size: .9rem; }
  .bar button, .bar a.btn { border: 1px solid #b9bfcc; background: #fff; color: inherit; border-radius: 999px; padding: .45rem .9rem; font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; text-decoration: none; }
  .bar button[aria-pressed="true"] { background: #0b0d12; color: #fff; border-color: #0b0d12; }
  .bar .print { background: #1f3dff; color: #fff; border-color: #1f3dff; }
  main { padding: 24px 16px 60px; }
  .msg { max-width: 560px; margin: 10vh auto; text-align: center; color: #4a5161; }
  @media print { .bar { display: none; } body { background: #fff; } main { padding: 0; } }
</style>
</head>
<body>
<div class="bar">
  <a class="home" href="/">LAGOA</a>
  <span id="tabs" role="group" aria-label="Documentos del pedido"></span>
  <button type="button" class="print" id="print" hidden>Imprimir / guardar PDF</button>
</div>
<main id="doc"><p class="msg">Cargando tu documento…</p></main>

<script src="../assets/documento.js"></script>
<script>
'use strict';
(async function () {
  const q = new URLSearchParams(location.search);
  const main = document.getElementById('doc');
  const fail = t => { main.replaceChildren(Object.assign(document.createElement('p'), { className: 'msg', textContent: t })); };
  let d;
  try {
    const r = await fetch(`/api/documento?p=${encodeURIComponent(q.get('p') || '')}&t=${encodeURIComponent(q.get('t') || '')}`, { cache: 'no-store' });
    if (!r.ok) return fail('No encontramos este documento. Revisa el enlace o escríbenos.');
    d = await r.json();
  } catch { return fail('No se ha podido cargar. Inténtalo de nuevo en un momento.'); }

  const p = d.pedido;
  const ESTADO = {
    pendiente_pago: { clase: 'pend', texto: 'Pendiente de aceptar' }, pagado: { clase: 'ok', texto: 'Pagado' },
    en_curso: { clase: 'ok', texto: 'Pagado · en desarrollo' }, entregado: { clase: 'ok', texto: 'Pagado · entregado' }, cancelado: { clase: 'bad', texto: 'Anulado' }
  };
  const mensual = p.mensual ? `Mantenimiento mensual elegido: ${Documento.money(p.mensual)}/mes (IVA incluido), se factura aparte cada mes y es cancelable.` : '';
  const pago = d.emisor.iban
    ? `Forma de pago: transferencia a ${d.emisor.iban} indicando “Presupuesto ${p.id}”, o Bizum. Empezamos el proyecto al recibir el pago.`
    : 'Forma de pago: te escribimos en menos de 24 h con las instrucciones (transferencia o Bizum). Empezamos al recibir el pago.';

  const docs = [{
    key: 'proforma', label: 'Presupuesto',
    data: {
      titulo: 'Presupuesto', codigo: `P-${String(p.id).padStart(4, '0')}`, fecha: p.fecha, estado: ESTADO[p.estado],
      emisor: d.emisor, cliente: p.facturacion, lineas: p.lineas, base: p.base, iva: p.iva, total: p.total,
      notas: ['Presupuesto cerrado según lo acordado en la llamada. No es una factura: la factura se emite al recibir el pago.', p.estado === 'pendiente_pago' ? pago : '', mensual]
    }
  }, ...d.facturas.map(f => ({
    key: f.codigo, label: f.codigo,
    data: {
      titulo: f.tipo === 'rectificativa' ? 'Factura rectificativa' : 'Factura', codigo: f.codigo, fecha: f.fecha,
      emisor: f.emisor, cliente: f.cliente, lineas: f.lineas, base: f.base, iva: f.iva, total: f.total,
      notas: [f.tipo === 'rectificativa' ? `Rectifica la factura ${f.rectificaCodigo} por anulación del presupuesto ${p.id}.` : `Presupuesto ${p.id}. Pagada.`, mensual]
    }
  }))];

  const tabs = document.getElementById('tabs');
  function show(key) {
    const doc = docs.find(x => x.key === key);
    Documento.render(main, doc.data);
    document.title = `${doc.data.titulo} ${doc.data.codigo} · Lagoa`;
    [...tabs.children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.key === key)));
  }
  if (docs.length > 1) docs.forEach(x => {
    const b = Object.assign(document.createElement('button'), { type: 'button', textContent: x.label });
    b.dataset.key = x.key;
    b.addEventListener('click', () => show(x.key));
    tabs.append(b);
  });
  const print = document.getElementById('print');
  print.hidden = false;
  print.addEventListener("click", () => window.print());
  show(docs[docs.length - 1].key);
})();
</script>
</body>
</html>
